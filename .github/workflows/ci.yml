name: CI

# **The framework only.** The desktop app and its Rust and frontend gates moved
# to their own repository, Swarm, with its release pipeline. What is left to
# check here is the framework's own documents and the checks themselves.
on:
  pull_request:
    branches: [ "main" ]

jobs:
  # **The documents the AI builds from are checked, not trusted.** Two of them
  # are read before code is written and are worse than useless once untrue: the
  # code map, whose stale row sends the next build looking in the wrong place —
  # the exact token-burning it exists to prevent — and an item's deliverable,
  # which decides when a build stops. Both scripts have no dependencies on
  # purpose, so this needs no install step and costs seconds.
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # **Depth, because one check needs a base to diff against.** The
          # round record is the only rule here whose fault is an absence, and
          # an absence is only visible next to what changed.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # **The checks are checked first.** Both of these have passed while
      # reading nothing at all — once on a CRLF checkout, once on a brief whose
      # deliverables were its last section. A green run from a check that cannot
      # fail is worse than no check, so the faults it must catch are tested.
      - name: The checks still catch what they are for
        run: node --test tools/lint.test.mjs
      # Not that the commands behave — they are prompts, and that pass is
      # tools/QA.md, run by a person against a real agent. This is that every
      # command exists, calls a skill that exists, names paths that are really
      # there, and travels into a project `coperativeai init` creates.
      - name: Every command still points at something that exists
        run: node --test tools/commands.test.mjs
      - name: The code map matches the code
        run: node tools/code-map-lint.mjs
      # **A misspelled deliverable is the quiet failure.** An item naming one
      # the Project Brief does not list looks aimed at something, and the
      # deliverable it was meant to finish never finishes — /build counts the
      # last item and there isn't one. Nothing else would notice.
      - name: Every brief's deliverable exists
        run: node tools/brief-lint.mjs
      # **The read-back people no longer do.** Every line of an AI spec names
      # the brief answer it came from; a line that cannot is invented scope.
      - name: Every line of every AI spec has a source
        run: node tools/spec-lint.mjs
      # **The record is the only feedback that runs back from the AI, and by
      # its own account the rule it is least able to keep: adherence to
      # administrative rules degrades exactly when a task got long, which is
      # when the debt was worth having. This cannot check the record is true —
      # a step nobody noticed skipping is invisible to any reader — but a round
      # of work that brought no record at all is now loud rather than silent.
      - name: A round of work brought a record with it
        run: node tools/round-record-lint.mjs --since ${{ github.event.pull_request.base.sha }}
