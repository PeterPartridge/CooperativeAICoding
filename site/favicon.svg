<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CooperativeAICoding">
  <!-- The four environments, in the order the workflow runs them:
       Product, Develop, Test, Admin. Same colours as the wordmark. -->
  <rect width="64" height="64" rx="14" fill="#14161a"/>
  <rect x="12" y="12" width="18" height="18" rx="4" fill="#7c3aed"/>
  <rect x="34" y="12" width="18" height="18" rx="4" fill="#0f766e"/>
  <rect x="12" y="34" width="18" height="18" rx="4" fill="#b45309"/>
  <rect x="34" y="34" width="18" height="18" rx="4" fill="#be123c"/>
</svg>
